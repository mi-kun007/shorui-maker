<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ご提案書</title>
<style>
@page{size:A4;margin:20mm 18mm}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;line-height:1.85;font-size:10.5pt;
     font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.page{page-break-after:always}
.page:last-child{page-break-after:auto}

.cover{height:253mm;display:flex;flex-direction:column;justify-content:center;
       align-items:center;text-align:center;border:1px solid #1a1a1a;padding:40px}
.cover .kicker{font-size:11pt;letter-spacing:.15em;color:#555;margin-bottom:18px}
.cover h1{font-size:26pt;margin:0 0 20px;letter-spacing:.03em}
.cover .catch{font-size:14pt;margin-bottom:60px;color:#333}
.cover .from{font-size:12pt;margin-top:40px}
.cover .date{font-size:10pt;color:#666;margin-top:8px}

h2{font-size:15pt;border-bottom:2px solid #1a1a1a;padding-bottom:8px;margin:0 0 20px}
h3{font-size:11.5pt;border-left:4px solid #1a1a1a;padding-left:8px;margin:24px 0 10px}

ul.track{list-style:none;padding:0;margin:10px 0}
ul.track li{padding:10px 0;border-bottom:1px dashed #ccc}
ul.track li .name{font-weight:bold}

.special{background:#1a1a1a;color:#fff;padding:14px 18px;margin-top:16px}
.special .was{text-decoration:line-through;color:#aaa;font-size:10pt}
.special .now{font-size:17pt;font-weight:bold}
.special .note{font-size:9pt;color:#ccc;margin-top:4px}

.goal-box{background:#f3f0e8;border:1px solid #d8d0ba;padding:22px 26px;
          margin-top:20px;font-size:11.5pt;line-height:2}
.goal-box p{margin:0 0 14px}
.goal-box p:last-child{margin-bottom:0}

.company-footer{margin-top:40px;padding-top:14px;border-top:1px solid #ddd;
                font-size:10pt;display:flex;justify-content:space-between;line-height:1.7}
.company-footer .contact{text-align:right}
</style></head><body>

<div class="page">
  <div class="cover">
    <div class="kicker">{{client}}{{honorific}}　{{contact}}</div>
    <h1>{{title}}</h1>
    <div class="catch">{{catch}}</div>
    <div class="from">{{issuer}}</div>
    <div class="date">{{date_ja}}</div>
  </div>
</div>

{{{sections_html}}}

<div class="page">
  <h2>{{closing_heading}}</h2>
  <div class="goal-box">{{{closing_html}}}</div>

  <h3>Next Action</h3>
  <p>{{next_action}}</p>

  <div class="company-footer">
    <div>{{issuer}}<br>{{rep_line}}</div>
    <div class="contact">{{{contact_html}}}</div>
  </div>
</div>

</body></html>
